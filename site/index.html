<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sale</title>
<meta name="description" content="This domain is for sale. Contact domains@lifeng.net">
<style>
body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;}
.page{padding:2rem;}
h1{font-size:clamp(2.5rem,8vw,6rem);margin:0 0 1.5rem;letter-spacing:-0.02em;word-break:break-word;}
p{font-size:clamp(1rem,2.2vw,1.3rem);line-height:1.7;margin:0.5rem 0;}
a{color:#111;}
</style>
</head>
<body>
<div class="page">
  <h1 id="domain">this domain</h1>
  <p>本域名正在出售，购买请联系 <a href="mailto:domains@lifeng.net">domains@lifeng.net</a></p>
  <p>This domain is for sale. Contact <a href="mailto:domains@lifeng.net">domains@lifeng.net</a></p>
</div>
<script>
(function () {
  var host = location.hostname.replace(/^www\./, "");
  if (!host) return;
  document.title = host + " \u2014 For Sale";
  var el = document.getElementById("domain");
  if (el) el.textContent = host;
  var meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute("content", host + " is for sale. Contact domains@lifeng.net");
})();
</script>
</body>
</html>
